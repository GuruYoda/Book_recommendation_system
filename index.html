<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header class="header">
      <h1>Snake</h1>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span id="score" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span id="high-score" class="stat-value">0</span>
        </div>
      </div>
    </header>

    <div class="board-wrapper">
      <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="overlay-title">Snake</h2>
          <p id="overlay-message">Use arrow keys or WASD to move.<br>Press Space to start.</p>
          <button id="start-btn" type="button">Play</button>
        </div>
      </div>
    </div>

    <footer class="controls-hint">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
      &nbsp;·&nbsp; <kbd>Space</kbd> pause &nbsp;·&nbsp; <kbd>R</kbd> restart
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
